name: Atualizar resultados

# Roda a cada 3 dias às 07:30 (horário de Brasília), quando alguém aciona manualmente
# na aba Actions, ou quando o script/workflow muda.
on:
  schedule:
    - cron: "30 10 */3 * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/atualizar_resultados.py
      - .github/workflows/atualizar-resultados.yml

permissions:
  contents: write

concurrency:
  group: atualizar-resultados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar resultados na API
        run: python3 scripts/atualizar_resultados.py

      - name: Salvar mudanças
        run: |
          if git diff --quiet -- dados/jogos.csv; then
            echo "Nenhuma mudança na base."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/jogos.csv
          git commit -m "Atualiza resultados (API ESPN)"
          git push
